<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="scjtransparent.png" />
  <title>SC Juke</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <img class="logo-icon" src="scjtransparent.png" alt="SC Juke" />
        <span class="logo-text">SC&nbsp;Juke</span>
      </div>

      <div class="sidebar-section-title">Playlists</div>
      <ul class="playlist-nav" id="playlistNav"></ul>
      <button id="newPlaylistBtn" class="btn sidebar-btn" type="button">
        +&nbsp; New playlist
      </button>

      <div class="sidebar-footer">
        <div class="sidebar-count" id="trackCount">0 saved</div>
        <button id="exportBtn" class="sidebar-action" type="button">
          Export this playlist
        </button>
        <div class="track-menu-wrap" id="exportMenuWrap">
          <button id="exportAllBtn" class="sidebar-action" type="button">
            Export all &#9662;
          </button>
          <div class="playlist-menu export-menu" id="exportMenu">
            <div class="playlist-menu-title">Export all songs</div>
            <button type="button" class="playlist-menu-item" data-export="playlists">
              <span class="playlist-menu-name">With playlists</span>
              <span class="playlist-menu-hint">keep groups</span>
            </button>
            <button type="button" class="playlist-menu-item" data-export="flat">
              <span class="playlist-menu-name">All songs</span>
              <span class="playlist-menu-hint">flat list</span>
            </button>
          </div>
        </div>
        <button id="importBtn" class="sidebar-action" type="button">
          Import...
        </button>
        <input
          type="file"
          id="importInput"
          accept=".json,.txt,.js,application/json,text/plain"
          hidden
        />
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="playlistName">Main</h1>
        <div class="topbar-actions">
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Search your list..."
            autocomplete="off"
          />
        </div>
      </header>

      <section class="content">
      <div class="list-col">
      <section class="add-section">
        <input
          type="url"
          id="urlInput"
          class="url-input"
          placeholder="Paste a YouTube link (https://www.youtube.com/watch?v=...)"
          autocomplete="off"
        />
        <button id="addBtn" class="btn btn-primary" type="button">Add</button>
      </section>
      <p class="status" id="status" role="status" aria-live="polite"></p>

      <ul class="track-list" id="trackList"></ul>

      <div class="empty-state" id="emptyState">
        <p>No songs in this playlist yet.</p>
        <p class="empty-sub">
          Paste a YouTube link above, or import a playlist from the sidebar.
        </p>
      </div>
      </div>

      <aside class="spotlight" id="spotlight">
        <h2 class="spotlight-heading">Spotlight</h2>
        <button
          class="spotlight-thumb"
          id="spotlightThumb"
          type="button"
          title="Click to copy URL"
        >
          <img id="spotlightImg" alt="" />
          <span class="spotlight-hint" id="spotlightHint">Click to copy URL</span>
        </button>
        <div class="spotlight-title" id="spotlightTitle"></div>
        <div class="spotlight-channel" id="spotlightChannel"></div>
        <button class="btn spotlight-shuffle" id="shuffleBtn" type="button">
          &#8635;&nbsp; Shuffle
        </button>
      </aside>
      </section>

    </main>
  </div>

  <!-- Custom dialog: replaces native prompt()/confirm() — the app never
       uses native browser popups. One container, two modes (confirm /
       text input), driven by askDialog()/askConfirm()/askName() in app.js. -->
  <div class="dialog-overlay" id="dialog">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-title" id="dialogTitle"></div>
      <p class="dialog-message" id="dialogMessage"></p>
      <input type="text" class="dialog-input" id="dialogInput" />
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="dialogCancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="dialogOk">OK</button>
      </div>
    </div>
  </div>

  <!-- Undo toast: appears after deleting a playlist or removing a song;
       stays ~6s with an Undo button. Ctrl+Z works even after it fades.
       Driven by the undo stack in app.js (pushUndo/syncUndoToast/performUndo). -->
  <div class="undo-toast" id="undoToast" role="status">
    <span class="undo-toast-msg" id="undoToastMsg"></span>
    <button type="button" class="undo-toast-undo" id="undoToastBtn">Undo</button>
    <button type="button" class="undo-toast-close" id="undoToastClose" title="Dismiss (Ctrl+Z still works)">&times;</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
